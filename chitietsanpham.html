<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>ELLA Store</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- HEADER -->
    <header class="container-custom-cart">
        <span class="logo">
            <h1>
                <a href="index.html">ELLA</a>
            </h1>
        </span>
        <div class="cart">
            <a href="giohang.html">
                <img src="image/cart.jpg" class="cart-icon">
                <span class="cart-count"></span>
            </a>
        </div>
    </header>
    <!-- CHI TIẾT SẢN PHẨM -->
    <div class="container-custom">
        <div class="detail-wrapper">
            <!-- ẢNH -->
            <div class="detail-image">
                <img src="image/giay1.jpg" alt="Giày">
            </div>
            <!-- THÔNG TIN -->
            <div class="detail-info">
                <h2 class="shoe-name">
                    Nike Air Force 1 All White
                </h2>
                <div class="shoe-price">
                    2.500.000đ
                </div>
                <p style="color: #666; line-height: 1.6;">
                    Dòng giày quốc dân với thiết kế da trắng cao cấp,
                    bền bỉ và cực kỳ dễ phối đồ.
                </p>
                <!-- SIZE EU -->
                <div class="size-section">
                    <h4>Chọn Kích Cỡ (Size EU):</h4>
                    <div class="size-options">
                        <div class="size-box"
                             onclick="selectSize(this)">
                            39
                        </div>
                        <div class="size-box active"
                             onclick="selectSize(this)">
                            40
                        </div>
                        <div class="size-box"
                             onclick="selectSize(this)">
                            41
                        </div>
                        <div class="size-box"
                             onclick="selectSize(this)">
                            42
                        </div>
                    </div>
                </div>
                <!-- SIZE US -->
                <div class="size-section">
                    <h4>Chọn Kích Cỡ (Size US):</h4>
                    <div class="size-options">
                        <div class="size-box"
                             onclick="selectSize(this)">
                            7
                        </div>
                        <div class="size-box active"
                             onclick="selectSize(this)">
                            8
                        </div>
                        <div class="size-box"
                             onclick="selectSize(this)">
                            9
                        </div>
                        <div class="size-box"
                             onclick="selectSize(this)">
                            10
                        </div>
                    </div>
                </div>
                <!-- NÚT THÊM GIỎ -->
                <button class="btn"
                        style="width: 250px; text-align: center;"
                        onclick="themVaoGio()">
                    Thêm vào giỏ hàng
                </button>
            </div>
        </div>
    </div>
    <script>
        // ==========================================
        // LẤY ID SẢN PHẨM TỪ ĐƯỜNG LINK
        // ==========================================
        let thamSo =
            new URLSearchParams(window.location.search);
        let idSanPham =
            thamSo.get("id");
        // ==========================================
        // DANH SÁCH SẢN PHẨM
        // ==========================================
        let danhSachSanPham = [
            {
                id: "1",
                name: "Nike Air Force 1 All White",
                price: 2500000,
                image: "image/giay1.jpg",
                description:
                   "Dòng giày quốc dân với thiết kế da trắng cao cấp, bền bỉ và cực kỳ dễ phối đồ."
            },
             {
                id: "2",
                name: "Adidas Superstar",
                price: 1900000,
                image: "image/Adidas Superstar.jpg",
                description:
                   "Dòng giày quốc dân với thiết kế da trắng cao cấp, bền bỉ và cực kỳ dễ phối đồ."
            },
         {
                id: "3",
                name: "Adida Grand Court 2.0k",
                price: 1350000,
                image: "image/adida1.webp",
                description:
                   "Dòng giày quốc dân với thiết kế da trắng cao cấp, bền bỉ và cực kỳ dễ phối đồ."
            },
         {
                id: "4",
                name: "Adidas UltraBoost",
                price:4500000,
                image: "image/adidas2.jpg",
                description:
                   "Dòng giày quốc dân với thiết kế da trắng cao cấp, bền bỉ và cực kỳ dễ phối đồ."
            },
         {
                id: "5",
                name: "Adidas Handball Spezial",
                price: 2800000,
                image: "image/adidas3.avif",
                description:
                   "Dòng giày quốc dân với thiết kế da trắng cao cấp, bền bỉ và cực kỳ dễ phối đồ."
            },
        ];
        // ==========================================
        // TÌM SẢN PHẨM
        // ==========================================
        let sanPhamDangXem =
            danhSachSanPham.find(function(sanPham) {
                return sanPham.id === idSanPham;
            });
        // ==========================================
        // HIỂN THỊ SẢN PHẨM
        // ==========================================

        if (sanPhamDangXem) {

            document.querySelector(".detail-image img").src =
                sanPhamDangXem.image;

            document.querySelector(".shoe-name").innerText =
                sanPhamDangXem.name;

            document.querySelector(".shoe-price").innerText =
                sanPhamDangXem.price.toLocaleString("vi-VN") + "đ";

            document.querySelector(".detail-info p").innerText =
                sanPhamDangXem.description;

        }
        // ==========================================
        // CHỌN SIZE
        // ==========================================
        let sizeDaChon = "40"
        function selectSize(element) {
            let cacSize =
                document.querySelectorAll(".size-box");
            cacSize.forEach(function(size) {
                size.classList.remove("active");
            });
            element.classList.add("active");
            sizeDaChon =
                element.innerText;
        }
        // ==========================================
        // THÊM VÀO GIỎ HÀNG
        // ==========================================

        function themVaoGio() {

            let sanPham = {

                name: sanPhamDangXem.name,

                price: sanPhamDangXem.price,

                image: sanPhamDangXem.image,

                size: sizeDaChon,

                quantity: 1

            };
            let gioHang =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];
            gioHang.push(sanPham);
            localStorage.setItem(
                "cart",
                JSON.stringify(gioHang)
            );
            alert("Đã thêm sản phẩm vào giỏ hàng!");
            window.location.href =
                "GioHang.html";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELLA - Thông Tin Đặt Hàng</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* CSS Trang trí giao diện Form điền thông tin chuẩn ELLA Store */
        .checkout-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: #ffffff;
            border: 1px solid #e1e1e1;
            border-radius: 8px;
            font-family: 'Segoe UI', Arial, sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .checkout-title {
            text-align: center;
            color: #111;
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 1px;
            font-size: 24px;
        }

        .bill-summary {
            background-color: #f9f9f9;
            padding: 15px 20px;
            border-left: 4px solid #000000;
            margin-bottom: 25px;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

            .form-group label {
                display: block;
                margin-bottom: 6px;
                font-weight: 600;
                color: #333;
                font-size: 14px;
            }

            .form-group input {
                width: 100%;
                padding: 12px;
                box-sizing: border-box;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 14px;
                transition: border-color 0.2s;
            }

                .form-group input:focus {
                    border-color: #000;
                    outline: none;
                }

        .btn-order {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: background 0.2s;
        }

            .btn-order:hover {
                background-color: #333333;
            }
    </style>
</head>
<body>

    <header class="container-custom-cart">
        <div class="logo">
            <h1><a href="Adidas.html" style="text-decoration: none; color: inherit;">ELLA</a></h1>
        </div>
        <nav>
            <a href="Adidas.html">Trang chủ</a>
            <a href="giohang.html">Giỏ hàng</a>
            <a href="lichsumuahang.html">Lịch sử mua hàng</a>
        </nav>
    </header>

    <!-- KHU VỰC FORM THÔNG TIN KHÁCH ĐẶT HÀNG (FRONTEND) -->
    <div class="checkout-container">
        <h2 class="checkout-title">Thông Tin Nhận Hàng</h2>

        <!-- Khung hiển thị tổng tiền tự động lấy từ bộ nhớ JavaScript Giỏ hàng sang -->
        <div class="bill-summary">
            <span>Thành tiền cần thanh toán:</span>
            <strong style="color: #e74c3c; font-size: 20px;"><span id="tongTienBill">0</span>đ</strong>
        </div>

        <!-- Các ô Input HTML để khách điền tên tuổi, địa chỉ -->
        <div class="form-group">
            <label>Họ và tên khách hàng *</label>
            <input type="text" id="txtHoTen" placeholder="Nhập đầy đủ họ và tên người nhận">
        </div>

        <div class="form-group">
            <label>Số điện thoại nhận hàng *</label>
            <input type="text" id="txtSoDienThoai" placeholder="Nhập số điện thoại liên hệ">
        </div>

        <div class="form-group">
            <label>Địa chỉ Email</label>
            <input type="email" id="txtEmail" placeholder="Nhập địa chỉ email (không bắt buộc)">
        </div>

        <div class="form-group">
            <label>Địa chỉ giao hàng *</label>
            <input type="text" id="txtDiaChi" placeholder="Số nhà, tên đường, phường/xã, quận/huyện">
        </div>

        <!-- NÚT BẤM KÍCH HOẠT LỆNH GỬI DỮ LIỆU ĐI SANG BACKEND -->
        <button type="button" class="btn-order" onclick="xuLyGoiDonHangDat()">
            Xác Nhận Đặt Hàng & Thanh Toán
        </button>
    </div>

    <!-- Đoạn JavaScript điều khiển dữ liệu kết nối thông suốt FE và BE -->
    <script>// 1. [FE lệnh]: Tự động lục trong máy tính lấy số tiền giỏ hàng lưu từ trước ra hiển thị lên hóa đơn
    const tongTienHienTai = parseFloat(localStorage.getItem("cartTotal")) || 0;
    const gioHangGoc = JSON.parse(localStorage.getItem("cart")) || [];

    // Gắn con số tiền thật vào ô chữ trên giao diện HTML
    document.getElementById("tongTienBill").innerText = tongTienHienTai.toLocaleString("vi-VN");

    // 2. [FE lệnh]: Hàm xử lý gom dữ liệu khách điền để bắn sang Backend C#
    function xuLyGoiDonHangDat() {
        const hoten = document.getElementById("txtHoTen").value.trim();
        const sdt = document.getElementById("txtSoDienThoai").value.trim();
        const email = document.getElementById("txtEmail").value.trim();
        const diachi = document.getElementById("txtDiaChi").value.trim();

        // Kiểm tra bảo mật form trống ở phía giao diện người dùng
        if (!hoten || !sdt || !diachi) {
            alert("Vui lòng điền đầy đủ các thông tin bắt buộc có dấu (*)!");
            return;
        }

        // Tạo cấu trúc danh sách chi tiết các món hàng khớp với Model OrderItems của Backend
        const danhSachItems = gioHangGoc.map(item => ({
            ProductId: 1,
            ProductName: item.name + " (Size: " + item.size + ")",
            Quantity: item.quantity,
            Price: item.price
        }));

        // Đóng gói tất cả thành đối tượng dữ liệu JSON thô gửi đi [soYHuZ]
        const dataDonHang = {
            FullName: hoten,
            Phone: sdt,
            Email: email,
            ShippingAddress: diachi,
            TotalAmount: tongTienHienTai,
            OrderItems: danhSachItems.length > 0 ? danhSachItems : [{ ProductId: 1, ProductName: "Sản phẩm ELLA", Quantity: 1, Price: tongTienHienTai }]
        };

        // Bắn dữ liệu xuyên biên giới sang đường dẫn API của máy chủ Backend C# của bạn [IZSMSG]
        // Chú ý: Hãy sửa lại số 44341 thành đúng số Port hiển thị khi bạn bấm Run dự án [p6Du2c].
        fetch("http://localhost:44341/api/orders/checkout", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dataDonHang)
        })
        .then(response => {
            if (!response.ok) throw new Error("Mạng hoặc hệ thống Backend phản hồi lỗi!");
            return response.json();
        })
        .then(result => {
            if (result.success) {
                alert("Đặt hàng thành công! Đơn hàng của bạn đã lưu trực tiếp vào cơ sở dữ liệu SQL Server.");
                localStorage.removeItem("cart"); // Mua thành công xóa sạch giỏ hàng cũ trên máy khách đi
                window.location.href = "lichsumuahang.html"; // FE ra lệnh tự chuyển màn hình sang xem lịch sử
            } else {
                alert("Hệ thống Backend báo lỗi từ chối: " + result.message);
            }
        })
        .catch(error => {
            console.error("Lỗi đường truyền:", error);
            alert("Không thể kết nối đến hệ thống Backend xử lý đơn hàng! Hãy đảm bảo bạn đã bấm nút Play (F5) trong Visual Studio.");
        });
    }</script>
</body>
</html>
